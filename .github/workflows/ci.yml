name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,doc,search,mcp]"
          # The memory subsystem is a separate distribution in this repo and is
          # not on PyPI: install it editable so the full suite exercises it.
          pip install -e packages/agent-base-memory
      - name: Ruff lint
        run: ruff check src tests examples packages
      - name: Ruff format check
        run: ruff format --check src tests examples packages

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,doc,search,mcp]"
          # The memory subsystem is a separate distribution in this repo and is
          # not on PyPI: install it editable so the full suite exercises it.
          pip install -e packages/agent-base-memory
      - name: Mypy (strict)
        run: mypy

  test:
    # Full test set (includes integration-marked tests) on Ubuntu only:
    # Windows runners do not support service containers.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,doc,search,mcp]"
          # The memory subsystem is a separate distribution in this repo and is
          # not on PyPI: install it editable so the full suite exercises it.
          pip install -e packages/agent-base-memory
      - name: Pytest
        # CLI 参数的 -m 覆盖 ini addopts 里的 "not integration"：
        # 本 job 挂了 MySQL 服务容器，跑全量集（含 integration）。
        run: pytest -m "integration or not integration"

  test-core:
    # 跨平台核心集（默认排除 integration）：为 requires-python >=3.10
    # 与"Windows 可用"的宣称提供 CI 背书。
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install -e ".[dev,doc,search,mcp]"
          # The memory subsystem is a separate distribution in this repo and is
          # not on PyPI: install it editable so the full suite exercises it.
          pip install -e packages/agent-base-memory
      - name: Pytest
        run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,doc,search,mcp]"
          pip install -e packages/agent-base-memory
      - name: pip-audit (ubuntu)
        # --skip-editable: agent-base itself is not a PyPI dependency;
        # everything it depends on is still audited.
        run: pip-audit --skip-editable

  memory-package:
    # The memory subsystem is a separately versioned distribution: verify it
    # builds standalone and exposes exactly the entry points the base looks for
    # ("agent_base.memory" -> service / routes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/agent-base-memory
      - name: Install and verify entry points
        run: |
          pip install -e ".[dev]"
          pip install --no-deps dist/*.whl
          python - <<'PY'
          import agent_base_memory
          from importlib.metadata import entry_points

          names = {ep.name for ep in entry_points(group="agent_base.memory")}
          assert names == {"service", "routes"}, names
          assert agent_base_memory.__name__ == "agent_base_memory"
          print("entry points found:", sorted(names))
          PY

  docker:
    # Verify the container image still builds on every push/PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agent-base:ci .
