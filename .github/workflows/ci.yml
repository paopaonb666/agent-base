name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,doc,search]"
      - name: Ruff lint
        run: ruff check src tests examples
      - name: Ruff format check
        run: ruff format --check src tests examples

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,doc,search]"
      - name: Mypy (strict)
        run: mypy

  test:
    # MySQL 全量集（含 integration 标记）：仅 ubuntu——Windows runner
    # 不支持 service 容器。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,doc,search]"
      - name: Pytest
        # CLI 参数的 -m 覆盖 ini addopts 里的 "not integration"：
        # 本 job 挂了 MySQL 服务容器，跑全量集（含 integration）。
        run: pytest -m "integration or not integration"

  test-core:
    # 跨平台核心集（默认排除 integration）：为 requires-python >=3.10
    # 与"Windows 可用"的宣称提供 CI 背书。
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,doc,search]"
      - name: Pytest
        run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,doc,search]"
      - name: pip-audit (ubuntu)
        # --skip-editable：本地 agent-base 包本身不是 PyPI 依赖；
        # 它所依赖的一切仍会被审计。
        run: pip-audit --skip-editable
