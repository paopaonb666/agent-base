# Alembic configuration for agent-base-memory (independent migration chain).
#
# This chain owns the six memory tables. It keeps its own version table
# (alembic_version_memory) so it can share one MySQL database with the base
# package's chain (alembic_version) without either side seeing the other's
# revisions.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Built dynamically in alembic/env.py from AGENT_BASE_DB_* or .env.
# Placeholder only; keep this file ASCII-only (configparser locale).
sqlalchemy.url = mysql+pymysql://root:@127.0.0.1:3306/agent_base?charset=utf8mb4


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
