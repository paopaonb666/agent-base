[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-base"
version = "0.1.0"
description = "Agent software foundation: LangGraph runtime + module registry + config + entrypoints; business capabilities plug in later as modules"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core orchestration runtime.
    # Floor 1.2.6: fixes CVE-2025-68664 (deserialization injection, CVSS 9.3),
    # CVE-2025-67644 (SQLite checkpointer SQL injection) and
    # CVE-2026-34070 (path traversal). See docs/adr/001-langgraph-as-runtime.md.
    "langgraph>=1.2.6",
    "langchain-core>=0.3",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_base"]

# ── Quality gates (local == CI, four doors) ─────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
