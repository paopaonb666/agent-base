[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-base"
version = "0.3.0"
description = "Agent software foundation: LangGraph runtime + module registry + config + entrypoints; business capabilities plug in later as modules"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "paopaonb666", email = "paopaonb666@users.noreply.github.com" }]
keywords = [
    "agents",
    "langgraph",
    "llm",
    "multi-agent",
    "fastapi",
    "memory",
    "orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # 核心编排运行时。
    # 下限 1.2.6：修复 CVE-2025-68664（反序列化注入，CVSS 9.3）、
    # CVE-2025-67644（SQLite checkpointer SQL 注入）以及
    # CVE-2026-34070（路径穿越）。见 docs/adr/001-langgraph-as-runtime.md。
    "langgraph>=1.2.6",
    # 消息 / 图原语。langchain-openai 1.x 需要 >=1.6。
    "langchain-core>=1.6",
    # openai 兼容的 LLM 客户端（deepseek / zhipu / 自定义均使用 ChatOpenAI）。
    "langchain-openai>=1.6",
    # 下限 2.2：NoDecode（用于接受列表类型 env 字段如 AGENT_MODULES 的
    # 普通逗号分隔值）是在 2.2 加入的。
    "pydantic-settings>=2.2",
    # 阶段 3：sqlite checkpointer 后端（memory 后端无需任何依赖）。
    # aiosqlite：运行时是异步优先的；同步的 SqliteSaver 无法服务
    # astream（NotImplementedError），因此我们使用 AsyncSqliteSaver。
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    # 阶段 3（扩展）：MySQL 对话状态后端（CHECKPOINTER_BACKEND=mysql）。
    # 使用 aiomysql 驱动的异步 AIOMySQLSaver；要求 MySQL >= 8.0.19。
    "langgraph-checkpoint-mysql[aiomysql]>=2.0",
    # PyMySQL 1.2.1 起删除了 escape_bytes_prefixed（PyMySQL#1274），1.2.3 又把它
    # 换成字符串占位符；aiomysql 0.3.2 在模块导入时就 from pymysql.converters
    # import escape_bytes_prefixed，于是：1.2.1/1.2.2 直接 ImportError，1.2.3
    # 导入成功但任何 BLOB 参数（记忆向量）抛 TypeError。aiomysql 尚无修复版本，
    # 因此在上限侧钉住 1.2.0，等 aiomysql 发版后再放宽。
    "pymysql>=1.1,<1.2.1",
    # MySQL 8 默认的 caching_sha2_password 认证在完整握手时需要 cryptography。
    "cryptography>=41.0",
    # 阶段 4：supervisor 多 Agent 模板（create_supervisor）。
    "langgraph-supervisor>=0.0.31",
    # 阶段 4：HTTP + SSE 服务入口。
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 文件上传端点的 multipart/form 解析（FastAPI 官方要求）。
    "python-multipart>=0.0.9",
    # 工具库 parsing（M4 前置）：PDF 文本提取。pypdf 纯 Python 且轻量，
    # PDF 又是文档读取的主格式，因此进主依赖开箱即用；DOCX 等重依赖
    # 格式走 [doc] extras 优雅降级。
    "pypdf>=5.0",
    # 工具库基础：httpx 供 Tavily 搜索引擎与后续网络工具使用（此前是
    # dev 依赖，fastapi TestClient 基于 httpx）；tzdata 是 Windows 上
    # zoneinfo 的时区数据库（current_time 工具需要，POSIX 自带）。
    "httpx>=0.27",
    "tzdata>=2024.1",
]

# 项目链接。注意：TOML 表必须写在 dependencies 数组之后、[project.scripts]
# 之前——把 URL 依赖写进 [project] 表会让 hatchling 把它当成数组元素解析，
# 报 "URL dependencies of field project.urls must be a string"。
[project.urls]
Homepage = "https://github.com/paopaonb666/agent-base"
Repository = "https://github.com/paopaonb666/agent-base"
Issues = "https://github.com/paopaonb666/agent-base/issues"
Documentation = "https://github.com/paopaonb666/agent-base/tree/main/docs"

[project.scripts]
agent-base = "agent_base.entrypoints.cli:main"

[project.optional-dependencies]
# 网络搜索扩展（DuckDuckGo 引擎）。未安装时 web_search 的 DDG 引擎
# 不可用（可改用 Tavily：配置 TAVILY_API_KEY 即可，Tavily 走 httpx）。
search = [
    "ddgs>=9.0",
]
# 文档解析扩展（DOCX）。未安装时 tools/parsing 的 docx 格式不注册，
# 其余格式不受影响——见 src/agent_base/tools/parsing/docx.py。
doc = [
    "python-docx>=1.1",
]
# MCP 工具来源扩展。未安装且 MCP_ENABLED=true 时启动即报错（启用即
# 承诺，见 src/agent_base/tools/mcp.py）；默认依赖不增重。
mcp = [
    "langchain-mcp-adapters>=0.3",
]
# 长期记忆子系统（0.3.0 起独立发行包）。基座只保留契约与 entry point
# 发现点；MEMORY_ENABLED=true（默认）时需要它，否则启动 fail-fast 提示。
# 从本仓库安装请用 `pip install -e packages/agent-base-memory`（尚未发布到
# PyPI，因此不能让 pip 去索引里解析这个 extra）。
memory = [
    "agent-base-memory>=0.1,<0.2",
]
# 数据库迁移：部署时执行 `alembic upgrade head` 需要（运行时镜像按此
# extra 安装）。本地开发经 dev extras 安装同一组依赖。记忆包有自己独立的
# 迁移链（packages/agent-base-memory/alembic.ini）。
migrate = [
    "alembic>=1.19",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # 覆盖率门（阶段 5）由 addopts 中的 --cov* 打开，本地与 CI 都必须装。
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    # fastapi 的 TestClient 基于 httpx。
    "httpx>=0.27",
    # 数据库迁移（alembic 需要 sqlalchemy 与同步 MySQL 驱动 pymysql）。
    "alembic>=1.19",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_base"]

# ── 质量门（本地 == CI，四道门） ─────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "alembic", "examples", "packages/agent-base-memory/src"]
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff 专属规则
]
# 项目已整体中文化：docstring、注释与中文用户可见字符串中的全角标点
# （括号/冒号/句号等）是有意为之的正确写法，因此关闭歧义字符提示。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "packages/agent-base-memory/src"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# resource 是 POSIX 专属的系统模块：在 Windows 上分析本模块时其属性
# 不可见，Linux CI 上一切正常。disable 而非行内 ignore，避免两端之间
# 的 unused-ignore 抖动。
module = ["agent_base.tools.repl"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# [mcp] extras 的延迟导入：本地未装 extras 时按 Any 处理；CI 装 extras，
# 以真实类型参与 strict 检查。
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: 需要外部服务（MySQL 等）的集成测试；默认本地运行被排除，CI（带 MySQL 服务容器）用 `-m \"integration or not integration\"` 全量执行",
]
# 覆盖率门（阶段 5）：每次 `pytest` 运行都会对整个包测量分支覆盖率，
# 低于 85% 即失败。集成测试（integration 标记）默认不在本地运行，
# 也不进入覆盖率分母——本地与 CI 的"测试通过"语义一致（P2-2）。
addopts = "-q --strict-markers -m \"not integration\" --cov=agent_base --cov=agent_base_memory --cov-branch --cov-report=term-missing --cov-fail-under=85"
