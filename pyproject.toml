[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-base"
version = "0.1.0"
description = "Agent software foundation: LangGraph runtime + module registry + config + entrypoints; business capabilities plug in later as modules"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # 核心编排运行时。
    # 下限 1.2.6：修复 CVE-2025-68664（反序列化注入，CVSS 9.3）、
    # CVE-2025-67644（SQLite checkpointer SQL 注入）以及
    # CVE-2026-34070（路径穿越）。见 docs/adr/001-langgraph-as-runtime.md。
    "langgraph>=1.2.6",
    # 消息 / 图原语。langchain-openai 1.x 需要 >=1.6。
    "langchain-core>=1.6",
    # openai 兼容的 LLM 客户端（deepseek / zhipu / 自定义均使用 ChatOpenAI）。
    "langchain-openai>=1.6",
    # 下限 2.2：NoDecode（用于接受列表类型 env 字段如 AGENT_MODULES 的
    # 普通逗号分隔值）是在 2.2 加入的。
    "pydantic-settings>=2.2",
    # 阶段 3：sqlite checkpointer 后端（memory 后端无需任何依赖）。
    # aiosqlite：运行时是异步优先的；同步的 SqliteSaver 无法服务
    # astream（NotImplementedError），因此我们使用 AsyncSqliteSaver。
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    # 阶段 3（扩展）：MySQL 对话状态后端（CHECKPOINTER_BACKEND=mysql）。
    # 使用 aiomysql 驱动的异步 AIOMySQLSaver；要求 MySQL >= 8.0.19。
    "langgraph-checkpoint-mysql[aiomysql]>=2.0",
    # MySQL 8 默认的 caching_sha2_password 认证在完整握手时需要 cryptography。
    "cryptography>=41.0",
    # 阶段 4：supervisor 多 Agent 模板（create_supervisor）。
    "langgraph-supervisor>=0.0.31",
    # 阶段 4：HTTP + SSE 服务入口。
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 文件上传端点的 multipart/form 解析（FastAPI 官方要求）。
    "python-multipart>=0.0.9",
    # 工具库 parsing（M4 前置）：PDF 文本提取。pypdf 纯 Python 且轻量，
    # PDF 又是文档读取的主格式，因此进主依赖开箱即用；DOCX 等重依赖
    # 格式走 [doc] extras 优雅降级。
    "pypdf>=5.0",
    # 工具库基础：httpx 供 Tavily 搜索引擎与后续网络工具使用（此前是
    # dev 依赖，fastapi TestClient 基于 httpx）；tzdata 是 Windows 上
    # zoneinfo 的时区数据库（current_time 工具需要，POSIX 自带）。
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.scripts]
agent-base = "agent_base.entrypoints.cli:main"

[project.optional-dependencies]
# 网络搜索扩展（DuckDuckGo 引擎）。未安装时 web_search 的 DDG 引擎
# 不可用（可改用 Tavily：配置 TAVILY_API_KEY 即可，Tavily 走 httpx）。
search = [
    "ddgs>=9.0",
]
# 文档解析扩展（DOCX）。未安装时 tools/parsing 的 docx 格式不注册，
# 其余格式不受影响——见 src/agent_base/tools/parsing/docx.py。
doc = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # 覆盖率门（阶段 5）由 addopts 中的 --cov* 打开，本地与 CI 都必须装。
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    # fastapi 的 TestClient 基于 httpx。
    "httpx>=0.27",
    # 数据库迁移（alembic 需要 sqlalchemy 与同步 MySQL 驱动 pymysql）。
    "alembic>=1.19",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_base"]

# ── 质量门（本地 == CI，四道门） ─────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "alembic", "examples"]
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff 专属规则
]
# 项目已整体中文化：docstring、注释与中文用户可见字符串中的全角标点
# （括号/冒号/句号等）是有意为之的正确写法，因此关闭歧义字符提示。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# resource 是 POSIX 专属的系统模块：在 Windows 上分析本模块时其属性
# 不可见，Linux CI 上一切正常。disable 而非行内 ignore，避免两端之间
# 的 unused-ignore 抖动。
module = ["agent_base.tools.repl"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: 需要外部服务（MySQL 等）的集成测试；默认本地运行被排除，CI（带 MySQL 服务容器）用 `-m \"integration or not integration\"` 全量执行",
]
# 覆盖率门（阶段 5）：每次 `pytest` 运行都会对整个包测量分支覆盖率，
# 低于 85% 即失败。集成测试（integration 标记）默认不在本地运行，
# 也不进入覆盖率分母——本地与 CI 的"测试通过"语义一致（P2-2）。
addopts = "-q --strict-markers -m \"not integration\" --cov=agent_base --cov-branch --cov-report=term-missing --cov-fail-under=85"
