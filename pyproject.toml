[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-base"
version = "0.1.0"
description = "Agent software foundation: LangGraph runtime + module registry + config + entrypoints; business capabilities plug in later as modules"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core orchestration runtime.
    # Floor 1.2.6: fixes CVE-2025-68664 (deserialization injection, CVSS 9.3),
    # CVE-2025-67644 (SQLite checkpointer SQL injection) and
    # CVE-2026-34070 (path traversal). See docs/adr/001-langgraph-as-runtime.md.
    "langgraph>=1.2.6",
    # Message/graph primitives. langchain-openai 1.x needs >=1.6.
    "langchain-core>=1.6",
    # openai-compatible LLM client (deepseek / zhipu / custom all use ChatOpenAI).
    "langchain-openai>=1.6",
    # Floor 2.2: NoDecode (needed to accept plain comma-separated values for
    # list-typed env fields like AGENT_MODULES) was added in 2.2.
    "pydantic-settings>=2.2",
    # Stage 3: sqlite checkpointer backend (memory backend needs nothing).
    # aiosqlite: the runtime is async-first; the sync SqliteSaver cannot
    # serve astream (NotImplementedError), so we use AsyncSqliteSaver.
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    # Stage 4: supervisor multi-agent template (create_supervisor).
    "langgraph-supervisor>=0.0.31",
    # Stage 4: HTTP + SSE service entrypoint.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
agent-base = "agent_base.entrypoints.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    # fastapi TestClient is httpx-based.
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_base"]

# ── Quality gates (local == CI, four doors) ─────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage gate (Stage 5): every `pytest` run — local or CI — measures
# branch coverage over the whole package and fails below 85%.
addopts = "-q --strict-markers --cov=agent_base --cov-branch --cov-report=term-missing --cov-fail-under=85"
